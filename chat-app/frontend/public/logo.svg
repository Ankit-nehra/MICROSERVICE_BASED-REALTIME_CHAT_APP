
<svg xmlns="http://www.w3.org/2000/svg"
     width="450"
     height="450"
     viewBox="0 0 450 450">

  <defs>
    <linearGradient id="chatGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="liveGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow dx="0"
                    dy="10"
                    stdDeviation="12"
                    flood-color="#0F172A"
                    flood-opacity=".20"/>
    </filter>
  </defs>


  <!-- Main Chat Bubble -->

  <path
    d="M256 70
       C151 70 66 142 66 231
       C66 286 97 334 145 365
       L126 424
       C124 431 131 436 138 432
       L204 397
       C221 401 238 404 256 404
       C361 404 446 331 446 231
       C446 142 361 70 256 70Z"
    fill="url(#chatGradient)"
    filter="url(#shadow)"/>


  <!-- Chat dots -->

  <circle cx="190"
          cy="235"
          r="18"
          fill="white"/>

  <circle cx="256"
          cy="235"
          r="18"
          fill="white"/>

  <circle cx="322"
          cy="235"
          r="18"
          fill="white"/>


  <!-- LIVE status -->

  <circle cx="390"
          cy="110"
          r="48"
          fill="white"/>

  <circle cx="390"
          cy="110"
          r="32"
          fill="url(#liveGradient)"/>

  <circle cx="390"
          cy="110"
          r="12"
          fill="white"/>

</svg>
